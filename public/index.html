<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a9dcf5">
<meta name="description" content="Crystal Cascade: a gem-matching puzzle game. Match gems, melt the frost, break the stone across twenty levels.">
<title>Crystal Cascade</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cascade">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Crystal Cascade">
<meta property="og:description" content="Match gems, melt the frost, break the stone.">
<meta property="og:image" content="/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a playful mining adventure, glowing and tactile
   IDEA: a jeweller's tray set into the wall of a crystal cave
   PICTURE: the 7x7 tray itself, full of faceted, light-catching gems
   COLOUR and TYPE: obsidian-teal cave, ice-cyan light, gold only for stars; Cinzel + Nunito
   LAYOUT: phone portrait first: top bar, HUD, then the board fills the rest */
:root{color-scheme:dark;--bg:#a9dcf5;--ink:#eafcff;--mute:#9cc0c6;--ice:#8ff0ff;--gold:#ffd166;--coral:#ff7b6b;--line:#2a5c63;--cell:48px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#e3f5ff 0%,rgba(227,245,255,0) 62%),radial-gradient(90% 50% at 50% 110%,#6fb8e0 0%,rgba(111,184,224,0) 65%),var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cave{position:fixed;left:0;bottom:0;width:100%;height:44vh;pointer-events:none;opacity:.5}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.board:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
.ib{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:linear-gradient(#143840,#0c262b);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 #04100f}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #04100f}
/* map */
#map{display:block;overflow-y:auto;overscroll-behavior:contain}
.maphead{text-align:center;padding:14px 16px 4px;max-width:560px;margin:0 auto}
.mapbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.starchip{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;background:#0c262b;border:1px solid var(--line);font-weight:900}
.starchip svg{width:20px;height:20px}
h1{font:900 clamp(36px,10vw,52px)/1.05 Cinzel,Georgia,serif;margin:20px 0 10px;text-wrap:balance;color:#0b3a52;text-shadow:0 0 28px rgba(255,255,255,.6)}
.maphead p{margin:0 auto;max-width:34ch;color:#12506f}
.path{position:relative;max-width:460px;margin:6px auto 0}
.path>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid #3d7d86;background:radial-gradient(circle at 35% 30%,#2a6a73,#0d2b30 70%);font:900 24px/1 Cinzel,serif;color:#eafcff;display:grid;place-items:center;box-shadow:0 6px 0 #061416,0 10px 24px rgba(0,0,0,.6);padding:0}
.node.done{border-color:#7fe9f5;background:radial-gradient(circle at 35% 30%,#4fd3df,#11535c 70%)}
.node.cur{border-color:#fff;background:radial-gradient(circle at 35% 30%,#d4fbff,#35bfcf 55%,#0f4d55);color:#05262b;animation:beacon 1.6s ease-in-out infinite}
.node.lock{background:#0b2024;border-color:#22474c;color:#4f7379;cursor:default}
.node.lock svg{width:22px;height:22px}
.ns{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.ns svg{width:17px;height:17px}
@keyframes beacon{50%{box-shadow:0 6px 0 #061416,0 0 0 10px rgba(143,240,255,.16),0 0 34px rgba(143,240,255,.65)}}
.mapfoot{text-align:center;padding:30px 16px 48px;display:grid;justify-items:center;gap:6px}
.install{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 20px;border-radius:16px;border:1px solid #33717a;background:linear-gradient(#173f46,#0e2a2f);color:var(--ink);font:800 16px/1 Nunito,sans-serif;box-shadow:0 4px 0 #04100f}
.install img{width:28px;height:28px;border-radius:7px}
.install[hidden]{display:none}
.steps{text-align:left;margin:14px 0 0;padding-left:1.3em;display:grid;gap:8px}
.steps li{color:var(--ink)}
.link{background:none;border:0;color:#12506f;text-decoration:underline;padding:10px 14px;min-height:44px}
/* game */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;max-width:560px;width:100%;margin:0 auto}
.top h2{flex:1;margin:0;text-align:center;font:900 21px/1.1 Cinzel,serif;color:#0b3a52}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:6px 12px;max-width:560px;width:100%;margin:0 auto}
.box{background:linear-gradient(#123439,#0b2428);border:1px solid #24525a;border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.box>span{font-size:13px;color:var(--mute);line-height:1.2}
.moves{min-width:64px}
.moves b{font:900 30px/1 Nunito,sans-serif}
.moves.low b{color:var(--coral)}
.goals{flex-direction:row;flex-wrap:wrap;gap:4px 12px}
.chip{display:flex;align-items:center;gap:4px;font:900 21px/1 Nunito,sans-serif;transition:transform .2s}
.chip svg{width:30px;height:30px;flex:none}
.chip.bump{transform:scale(1.22)}
.chip.done b{color:#6ff5a8}
.score{min-width:108px}
.score b{font:900 20px/1 Nunito,sans-serif;font-variant-numeric:tabular-nums}
.meter{position:relative;height:8px;width:92px;margin:9px 0 4px;border-radius:9px;background:#05161a;box-shadow:inset 0 1px 2px #000}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#5fe6f5,#fff3b0);width:0;transition:width .4s}
.meter svg{position:absolute;top:50%;width:17px;height:17px;transform:translate(-50%,-50%)}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px 8px 16px}
.frame{padding:8px;border-radius:22px;background:linear-gradient(160deg,#2c6169,#10333a 55%,#0a2125);box-shadow:inset 0 0 0 1px #4a8a93,0 22px 50px -12px #000,0 0 70px -14px rgba(54,201,213,.5)}
.frame.shake{animation:shake .34s}
.board{position:relative;width:calc(var(--cell)*7);height:calc(var(--cell)*7);border-radius:14px;overflow:hidden;background:#081d21;touch-action:none}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr)}
.cell{position:relative;background:#0e2c32;box-shadow:inset 0 0 0 1px #081d21}
.cell.d{background:#123840}
.cell.f1::after,.cell.f2::after{content:'';position:absolute;inset:2px;border-radius:10px;background:linear-gradient(135deg,rgba(214,250,255,.5),rgba(120,214,238,.22)),repeating-linear-gradient(60deg,transparent 0 6px,rgba(255,255,255,.22) 6px 7px);box-shadow:inset 0 0 0 1.5px rgba(225,252,255,.7),inset 0 0 12px rgba(255,255,255,.35)}
.cell.f2::after{background:linear-gradient(135deg,rgba(240,253,255,.78),rgba(160,230,248,.5)),repeating-linear-gradient(60deg,transparent 0 5px,rgba(255,255,255,.4) 5px 6px),repeating-linear-gradient(-60deg,transparent 0 5px,rgba(255,255,255,.3) 5px 6px);box-shadow:inset 0 0 0 2.5px #fff,inset 0 0 14px #fff}
.cell.melt::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);animation:fade .4s forwards;z-index:1}
.gems,.fxl{position:absolute;inset:0;pointer-events:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gem{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transform:translate(calc(var(--c)*100%),calc(var(--r)*100%))}
.gem svg{display:block;width:100%;height:100%;transition:transform .15s}
.gem.sel::before{content:'';position:absolute;inset:3px;border-radius:12px;background:rgba(143,240,255,.22);box-shadow:0 0 0 2.5px #fff,0 0 16px 3px rgba(143,240,255,.8)}
.gem.sel svg{transform:scale(1.12)}
.gem.sp-b svg,.gem.sp-h svg,.gem.sp-v svg{animation:throb 1.2s ease-in-out infinite}
.gem.sp-p svg{animation:hue 2.4s linear infinite}
.gem.hint svg{animation:hint .9s ease-in-out infinite}
.gem.no svg{animation:no .3s}
.gem.born svg{animation:born .45s ease-out}
.gem.pop svg{animation:pop .26s ease-in forwards}
.beam{position:absolute;left:0;top:0;pointer-events:none;border-radius:99px;opacity:0}
.beam.h{width:100%;background:linear-gradient(90deg,transparent,#fff 15%,#fff 85%,transparent);animation:beamh .4s ease-out}
.beam.v{height:100%;background:linear-gradient(180deg,transparent,#fff 15%,#fff 85%,transparent);animation:beamv .4s ease-out}
.ring{position:absolute;border-radius:50%;border:5px solid #fff;pointer-events:none;animation:ring .45s ease-out forwards}
.pt{position:absolute;transform:translate(-50%,-50%);font:900 20px/1 Nunito,sans-serif;color:#fff;text-shadow:0 2px 0 #062a30,0 0 10px currentColor;pointer-events:none;animation:rise .9s ease-out forwards;white-space:nowrap}
.say{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 10px;pointer-events:none;font:900 clamp(26px,8vw,42px)/1.1 Cinzel,serif;color:#fff;text-shadow:0 0 18px var(--ice),0 3px 0 #0a3d45;animation:say 1.1s ease-out forwards}
.kcur{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);border-radius:12px;box-shadow:inset 0 0 0 3px #ffd166;display:none;transform:translate(calc(var(--c)*100%),calc(var(--r)*100%))}
.board:focus-visible .kcur{display:block}
@keyframes hint{50%{transform:scale(1.14) rotate(-6deg)}}
@keyframes no{25%{transform:translateX(-12%)}75%{transform:translateX(12%)}}
@keyframes pop{40%{transform:scale(1.3);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes born{0%{transform:scale(.4);filter:brightness(3)}60%{transform:scale(1.25);filter:brightness(1.6)}}
@keyframes throb{50%{transform:scale(1.07)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes beamh{0%{opacity:1;transform:scaleY(1.6) scaleX(.1)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleY(.2)}}
@keyframes beamv{0%{opacity:1;transform:scaleX(1.6) scaleY(.1)}30%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleX(.2)}}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes rise{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-40px}}
@keyframes say{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.08);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.1);opacity:0}}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
@keyframes fade{to{opacity:0}}
@keyframes pin{from{transform:scale(.85);opacity:0}}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(2,10,12,.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#modal.on{display:grid}
.card{width:min(400px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:linear-gradient(170deg,#173f46,#0b2226);border:1px solid #33717a;border-radius:24px;padding:24px 20px 20px;text-align:center;box-shadow:0 30px 70px -10px #000,0 0 60px -20px rgba(143,240,255,.5);animation:pin .22s ease-out}
.card h3{margin:0 0 4px;font:900 32px/1.05 Cinzel,serif;text-wrap:balance}
.card p{margin:6px 0;color:var(--mute)}
.card .lead{color:var(--ink);font-size:17px}
.glist{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px;text-align:left}
.glist li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:#0a2226;border:1px solid #1f4950}
.glist svg{width:34px;height:34px;flex:none}
.tip{margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:rgba(143,240,255,.08);border:1px dashed #3b7b84;color:var(--ink);text-align:left;font-size:15px}
.btns{display:grid;gap:10px;margin-top:18px}
.btn{min-height:50px;border-radius:16px;border:0;padding:10px 18px;font:900 18px/1 Nunito,sans-serif;background:linear-gradient(#bff8ff,#5fd8e6);color:#05262b;box-shadow:0 4px 0 #1d7d88}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d7d88}
.btn.ghost{background:#0e2a2f;color:var(--ink);border:1px solid #33717a;box-shadow:0 4px 0 #04100f}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;justify-content:center;gap:6px;margin:14px 0 6px}
.big svg{width:64px;height:64px}
.big svg.on{animation:starin .5s ease-out backwards}
.big svg:nth-child(2){margin-top:-14px}
.final{font:900 34px/1 Nunito,sans-serif}
.tog{display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:0 14px;border-radius:16px;background:#0a2226;border:1px solid #1f4950;width:100%;font-weight:800}
.tog i{font-style:normal;padding:4px 12px;border-radius:99px;background:#22474c;color:var(--mute)}
.tog i.on{background:#5fd8e6;color:#05262b}
.how{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px;text-align:left}
.how li{display:flex;gap:12px;align-items:center;font-size:15px}
.how svg{width:40px;height:40px;flex:none}
.how b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.frame.shake,.node.cur,.gem.sp-b svg,.gem.sp-h svg,.gem.sp-v svg,.gem.sp-p svg{animation:none}.gem.hint svg{animation:none;filter:drop-shadow(0 0 6px #fff) brightness(1.3)}}
@media (max-width:380px){.score{min-width:92px}.meter{width:78px}.chip{font-size:18px}.chip svg{width:26px;height:26px}.moves b{font-size:26px}}
</style>
</head>
<body>
<svg id="defs" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></svg>
<svg class="cave" id="cave" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>

<section id="map" class="screen">
  <header class="maphead">
    <div class="mapbar">
      <button class="ib" id="helpBtn" aria-label="How to play"></button>
      <span class="starchip" aria-label="Stars collected"><span id="starIco"></span><b id="starTotal">0</b>&nbsp;/ 60</span>
      <button class="ib" id="sndBtnMap" aria-label="Sound on or off"></button>
    </div>
    <h1>Crystal Cascade</h1>
    <p>Twenty chambers deep in the crystal mine. Match gems, melt the frost, break the stone.</p>
  </header>
  <div class="path" id="path"><svg id="pathSvg" aria-hidden="true"></svg></div>
  <footer class="mapfoot"><button class="install" id="installBtn" hidden><img src="/icons/icon-192.png" alt="">Install the app</button><button class="link" id="resetBtn">Reset progress</button></footer>
</section>

<section id="game" class="screen" hidden>
  <div class="top">
    <button class="ib" id="pauseBtn" aria-label="Pause"></button>
    <h2 id="lvlTitle">Level 1</h2>
    <button class="ib" id="sndBtn" aria-label="Sound on or off"></button>
  </div>
  <div class="hud">
    <div class="box moves" id="movesBox"><b id="movesN">0</b><span>moves</span></div>
    <div class="box goals" id="goals" aria-label="Goals"></div>
    <div class="box score"><b id="scoreN">0</b><div class="meter" id="meter"><i id="meterFill"></i></div></div>
  </div>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <div class="board" id="board" tabindex="0" aria-label="Game board. Use arrow keys to move, Enter to select and swap.">
        <div class="cells" id="cells"></div>
        <div class="gems" id="gems"></div>
        <canvas id="fx"></canvas>
        <div class="fxl" id="fxl"><div class="kcur" id="kcur"></div></div>
      </div>
    </div>
  </div>
</section>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card" id="card"></div></div>

<script>
{
const N=7, $=s=>document.getElementById(s);
const PAL=[['#6d0820','#e3264d','#ffa3b5'],['#0a2580','#2f6bff','#adc9ff'],['#045a37','#16b865','#a0f7c8'],['#8a5200','#ffb21f','#ffeaa3'],['#43117a','#9a4dff','#dec4ff'],['#45627a','#c3def2','#ffffff']];
const NAMES=['Ruby','Sapphire','Emerald','Citrine','Amethyst','Moonstone'];
const GLOW=['#ff5a78','#5a95ff','#3ef09a','#ffcc4d','#bb85ff','#e6f6ff'];
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
let SPEED=1;

/* ---------- gem art: faceted polygons generated from a shape outline ---------- */
const poly=(n,r,rot,cx=50,cy=50)=>Array.from({length:n},(_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]});
const pear=[[50,5]].concat(Array.from({length:11},(_,i)=>{const a=(-48+i*27.6)*Math.PI/180;return[50+35*Math.cos(a),60+34*Math.sin(a)]}));
const SHAPES=[poly(6,45,-90),[[50,4],[90,47],[50,96],[10,47]],[[32,8],[68,8],[84,24],[84,76],[68,92],[32,92],[16,76],[16,24]],poly(12,44,-90),[[50,7],[94,85],[6,85]],pear];
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{t=Math.max(0,Math.min(1,t));const A=hx(a),B=hx(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'};
const P=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function facet(id,pts,pal,o={}){
  const n=pts.length,cx=pts.reduce((s,p)=>s+p[0],0)/n,cy=pts.reduce((s,p)=>s+p[1],0)/n,ts=o.t||.5;
  const T=pts.map(([x,y])=>[cx+(x-cx)*ts,cy+(y-cy)*ts-2]);
  const sh=t=>t<.5?mix(pal[0],pal[1],t*2):mix(pal[1],pal[2],(t-.5)*2);
  let g=`<linearGradient id="t${id}" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="${o.hue?'#ffffff':pal[2]}"/><stop offset="1" stop-color="${o.hue?'#d8ecff':pal[1]}"/></linearGradient>`;
  let s=`<ellipse cx="50" cy="94" rx="30" ry="4.5" fill="#000" opacity=".4"/><polygon points="${P(pts)}" fill="${pal[0]}"/>`;
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n],A=T[i],B=T[(i+1)%n],mx=(a[0]+b[0])/2-cx,my=(a[1]+b[1])/2-cy,l=Math.hypot(mx,my)||1;
    const t=((-.55*mx-.83*my)/l+1)/2;
    const c1=o.hue?`hsl(${i*360/n},92%,${48+t*24}%)`:sh(.08+t*.88), c2=o.hue?`hsl(${i*360/n+14},92%,${40+t*22}%)`:sh(t*.88-.04);
    s+=`<polygon points="${P([a,b,B])}" fill="${c1}" stroke="${c1}" stroke-width=".6"/><polygon points="${P([a,B,A])}" fill="${c2}" stroke="${c2}" stroke-width=".6"/>`;
  }
  s+=`<polygon points="${P(T)}" fill="url(#t${id})" stroke="#fff" stroke-opacity=".45" stroke-width="1"/><polygon points="${P(pts)}" fill="none" stroke="${pal[0]}" stroke-width="2.4" stroke-linejoin="round"/>`;
  if(!o.dull){const ex=cx-9,ey=cy-11,sx=cx+11,sy=cy-15;
    s+=`<ellipse cx="${ex}" cy="${ey}" rx="8" ry="3.6" transform="rotate(-35 ${ex} ${ey})" fill="#fff" opacity=".8"/><path d="M${sx} ${sy-7}L${sx+1.5} ${sy-1.5}L${sx+7} ${sy}L${sx+1.5} ${sy+1.5}L${sx} ${sy+7}L${sx-1.5} ${sy+1.5}L${sx-7} ${sy}L${sx-1.5} ${sy-1.5}Z" fill="#fff" opacity=".9"/>`;}
  return{g,s:`<symbol id="${id}" viewBox="-4 -4 108 108">${s}</symbol>`};

  const cand=[];

  if(sp==='b')Object.keys(cnt).filter(k=>cnt[k]>1).forEach(k=>cand.push(+k));

  for(const[k,src]of hits){const[r,c]=rc(k),it=grid[r][c];
    if(frost[r][c]>0){frost[r][c]--;paintCell(r,c);const ce=$('cells').children[k];ce.classList.remove('melt');void ce.offsetWidth;ce.classList.add('melt');goal('frost',1);pts+=100;melted++}
    if(!it)continue;

  for(const m of made){const[r,c]=rc(m.k),it=grid[r][c];if(!it)continue;it.sp=m.sp;if(m.sp==='p')it.color=-1;paint(it);it.el.classList.add('born');pts+={h:200,v:200,b:400,p:800}[m.sp]}

}
function pop(it){const el=it.el;el.classList.add('pop');setTimeout(()=>el.remove(),280*SPEED)}
async function gravity(){
  let max=0;const sp=[];

    for(let r=N-1;r>=0;r--){const it=grid[r][c];if(!it)continue;if(r!==w){grid[w][c]=it;grid[r][c]=null;const t=110+(w-r)*60;place(it,w,c,t,'cubic-bezier(.5,.05,.6,1.15)');max=Math.max(max,t)}w--}
    const need=w+1;for(let r=w;r>=0;r--){const it=mk(newGem());grid[r][c]=it;place(it,r-need,c);sp.push([it,r,c,need])}}
  if(sp.length){void gemsL.offsetHeight;for(const[it,r,c,need]of sp){const t=110+need*60+c*12;place(it,r,c,t,'cubic-bezier(.5,.05,.6,1.15)');max=Math.max(max,t)}}
  if(max){await sleep(max);sfx.land()}

const WORDS=['','','Sparkling!','Dazzling!','Brilliant!','Radiant!','Legendary!'];
async function cascade(pref){
  let casc=0;
  for(let guard=0;guard<80;guard++){
    const gs=findGroups();if(!gs.length)break;casc++;
    const hits=new Map(),made=[],matched=[];
    for(const g of gs){g.cells.forEach(k=>{hits.set(k,'m');matched.push(k)});const d=decide(g,pref);if(d)made.push(d)}
    if(casc>=2){say(WORDS[Math.min(casc,6)]);if(casc>=3)buzz(20)}
    await blast(hits,{made,casc,matched});
    await gravity();pref=null;
  }
}
async function swapAnim(a,b){const A=at(...a),B=at(...b);grid[a[0]][a[1]]=B;grid[b[0]][b[1]]=A;A.el.style.zIndex=2;place(A,b[0],b[1],170);place(B,a[0],a[1],170);await sleep(175);A.el.style.zIndex=''}
async function combo(A,B,pa,pb){ // A now sits at pa, B at pb
  const hits=new Map(),add=(r,c)=>{if(inB(r,c))hits.set(key(r,c),'x')};
  add(...pa);add(...pb);
  const isL=s=>s==='h'||s==='v';
  if(A.sp==='p'&&B.sp==='p'){A.fired=B.fired=true;for(let r=0;r<N;r++)for(let c=0;c<N;c++){add(r,c);if(Math.random()<.4)ray(pa[0],pa[1],r,c,GLOW[rnd(6)])}sfx.zap();say('Supernova!')}
  else if(A.sp==='p'||B.sp==='p'){
    const Pr=A.sp==='p'?A:B,O=Pr===A?B:A,pp=Pr===A?pa:pb;Pr.fired=true;sfx.zap();
    const tg=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const it=grid[r][c];if(it&&it.k==='gem'&&it.color===O.color&&it!==O)tg.push([r,c,it])}
    if(!O.sp){tg.forEach(([r,c])=>{add(r,c);ray(pp[0],pp[1],r,c,GLOW[O.color])});O.fired=false}
    else{for(const[r,c,it]of tg){if(!it.sp&&!it.lock){it.sp=O.sp==='b'?'b':(Math.random()<.5?'h':'v');paint(it);it.el.classList.add('born')}ray(pp[0],pp[1],r,c,GLOW[O.color]);add(r,c)}sfx.make();await sleep(420)}
  } else {
    A.fired=B.fired=true;const[r,c]=pa,col=GLOW[A.color];
    if(isL(A.sp)&&isL(B.sp)){for(let i=0;i<N;i++){add(r,i);add(i,c)}beam('h',r,col);beam('v',c,col)}
    else if(A.sp==='b'&&B.sp==='b'){for(let y=r-2;y<=r+2;y++)for(let x=c-2;x<=c+2;x++)add(y,x);ring(r,c,2,col);ring(r,c,1,'#fff')}
    else{for(let d=-1;d<=1;d++)for(let i=0;i<N;i++){add(r+d,i);add(i,c+d)}for(let d=-1;d<=1;d++){if(inB(r+d,0))beam('h',r+d,col);if(inB(0,c+d))beam('v',c+d,col)}}
    sfx.blast();shake();buzz([30,30,50]);
  }
  await blast(hits,{casc:1});await gravity();
}
async function trySwap(a,b){
  if(busy||over||!inB(...b))return;
  const A=at(...a),B=at(...b);clearSel();clearHint();
  if(!movable(A)||!movable(B)){[A,B].forEach(x=>{if(x&&!movable(x)){x.el.classList.remove('no');void x.el.offsetWidth;x.el.classList.add('no')}});sfx.no();armHint();return}
  busy=true;sfx.swap();buzz(8);
  await swapAnim(a,b);
  if(A.sp==='p'||B.sp==='p'||(A.sp&&B.sp)){moves--;hud();await combo(A,B,b,a);await cascade(null)}
  else if(!findGroups().length){sfx.no();await swapAnim(b,a);busy=false;armHint();return}
  else{moves--;hud();await cascade([b,a])}

}
async function endTurn(){

async function rush(){

    const it=pool[rnd(pool.length)];it.sp=Math.random()<.5?'h':'v';paint(it);it.el.classList.add('born');moves--;hud();tone(880+moves*40,.08,'triangle',.06);await sleep(120)}
  for(let i=0;i<8;i++){const hits=new Map();grid.forEach((row,r)=>row.forEach((it,c)=>{if(it&&it.k==='gem'&&it.sp&&!it.lock)hits.set(key(r,c),'x')}));if(!hits.size)break;await blast(hits,{casc:1});await gravity();await cascade(null)}
}
async function shuffle(){
  say('Shuffling…');await sleep(500);
  const cells=[],items=[];grid.forEach((row,r)=>row.forEach((it,c)=>{if(movable(it)&&!it.sp){cells.push([r,c]);items.push(it)}}));

  let ok=false;
  for(let t=0;t<300&&!ok;t++){for(let i=items.length-1;i>0;i--){const j=rnd(i+1);[items[i],items[j]]=[items[j],items[i]]}if(t>150)items.forEach(it=>{it.color=rnd(L.c)});assign();ok=!findGroups().length&&moveList().length>0}
  items.forEach(paint);cells.forEach(([r,c],i)=>place(items[i],r,c,420));await sleep(440);

board.addEventListener('pointercancel',()=>{down=null});
board.addEventListener('contextmenu',e=>e.preventDefault());
function tap(p){if(busy||over)return;if(sel){const s=sel;if(s[0]===p[0]&&s[1]===p[1]){clearSel();armHint();return}if(Math.abs(s[0]-p[0])+Math.abs(s[1]-p[1])===1){trySwap(s,p);return}}const it=at(...p);if(movable(it)){setSel(p);sfx.land()}else{clearSel();if(it){it.el.classList.remove('no');void it.el.offsetWidth;it.el.classList.add('no')}}}
const kcur=$('kcur');const drawK=()=>{kcur.style.setProperty('--r',kc[0]);kcur.style.setProperty('--c',kc[1])};drawK();
board.addEventListener('keydown',e=>{const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
  if(d){e.preventDefault();kc=[Math.max(0,Math.min(N-1,kc[0]+d[0])),Math.max(0,Math.min(N-1,kc[1]+d[1]))];drawK()}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();audio();tap([...kc])}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],.node');if(!b)return;audio();const a=b.dataset.a;
  if(b.classList.contains('node'))return intro(+b.dataset.i);
  if(a==='play')startLevel(+b.dataset.i);else if(a==='close'){closeModal();if(!over)armHint()}
  else if(a==='retry')startLevel(lvl);else if(a==='next')intro(lvl+1);
  else if(a==='map'){closeModal();clearHint();over=true;show('map')}
  else if(a==='snd'){save.sound=!save.sound;persist();setSnd();pause()}else if(a==='vib'){save.vib=!save.vib;persist();buzz(30);pause()}});
$('pauseBtn').onclick=()=>{if(busy&&over)return;if(!over){clearHint();pause()}else{closeModal();show('map')}};
[$('sndBtn'),$('sndBtnMap')].forEach(b=>b.onclick=()=>{save.sound=!save.sound;persist();setSnd();if(save.sound)sfx.swap()});
$('helpBtn').innerHTML=ICON.help;$('helpBtn').onclick=howto;$('pauseBtn').innerHTML=ICON.pause;$('starIco').innerHTML=ICON.star(1);
let resetArm=0;$('resetBtn').onclick=e=>{if(!resetArm){resetArm=1;e.target.textContent='Tap again to erase all stars';setTimeout(()=>{resetArm=0;e.target.textContent='Reset progress'},3000);return}
  save={un:0,stars:[],best:[],sound:save.sound,vib:save.vib};persist();resetArm=0;e.target.textContent='Progress erased';renderMap()};
$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&(!over||!$('map').hidden))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('on')&&(!over||!$('map').hidden))closeModal()});
new ResizeObserver(()=>{fit();if(!$('map').hidden)renderMap()}).observe(document.body);
setSnd();show('map');
if(!save.stars.length&&!save.un)setTimeout(howto,350);

/* ---------- installable app ---------- */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferred=null;const ib=$('installBtn');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone)ib.hidden=false});
addEventListener('appinstalled',()=>{ib.hidden=true;deferred=null});
if(ios&&!standalone)ib.hidden=false;
ib.onclick=async()=>{
  if(deferred){deferred.prompt();try{const r=await deferred.userChoice;if(r.outcome==='accepted')ib.hidden=true}catch(_){}deferred=null;return}
  modal(`<h3 id="mt">Install Crystal Cascade</h3><p class="lead">Play full screen, straight from your home screen, even offline.</p>
   <ol class="steps">${ios?'<li>Open this page in Safari.</li><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>':'<li>Open your browser menu.</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li>'}</ol>
   <div class="btns"><button class="btn" data-a="close">Got it</button></div>`)};
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

window.__cc={speed:s=>SPEED=s,start:startLevel,swap:trySwap,moves:moveList,state:()=>({moves,score,over,busy,goals:goals.map(g=>({...g})),grid:grid.map(r=>r.map(it=>!it?'_':it.k==='stone'?'S'+it.hp:(it.sp?it.sp:'')+it.color+(it.lock?'L':''))),frost}),win:()=>save};
}
</script>
</body>
</html>
